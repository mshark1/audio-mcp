name: Release

# Publishes to PyPI when a GitHub release is published. Uses PyPI "trusted publishing", so no API token is stored
# in the repository. One-time setup on pypi.org: add a trusted publisher for this repo, workflow `release.yml`,
# environment `pypi`. See RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} != v$version"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Lists (or updates) the server in the official MCP Registry as io.github.mshark1/audio-mcp. Authenticates with
    # GitHub OIDC, so no secret is stored. The registry verifies the PyPI package's README contains
    # "mcp-name: <server name>", so this must run after the PyPI upload is visible.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches the release tag
        run: |
          version=$(jq -r .version server.json)
          test "v$version" = "${{ github.event.release.tag_name }}" || { echo "server.json $version != tag"; exit 1; }
      - name: Wait for the new version to appear on PyPI
        run: |
          version=$(jq -r .version server.json)
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/audio-mcp/$version/json" > /dev/null && exit 0
            sleep 10
          done
          echo "audio-mcp $version not visible on PyPI after 5 minutes"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
