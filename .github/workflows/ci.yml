name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: End-to-end over MCP stdio
        run: python scripts/smoke_stdio.py "${{ runner.temp }}/smoke"

  oldest-dependencies:
    # Proves the lower bounds in pyproject.toml are real, not aspirational.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.10 .venv
      - run: uv pip install --python .venv --resolution lowest-direct -e ".[dev]"
      - run: .venv/bin/python -m pip list 2>/dev/null | grep -Ei "^(numpy|scipy|soundfile|matplotlib|mcp) " || uv pip list --python .venv
      - run: .venv/bin/python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean venv and run the server end to end
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_stdio.py" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
